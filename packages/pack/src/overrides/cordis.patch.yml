# D剪 profile 补丁（DSH 0.2.0-rc.2）。规则提醒：
#  · 按 id 定位整行覆盖 config（需完整重述）；name 只是匹配条件，换实现要 disabled + insert
#  · 新插件行必须写在 insert: 里，否则会被丢弃

# ---- 模型路由：GLM 走通用 OpenAI 协议（保留路由名 deepseek-official 兼容旧会话引用） ----
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      deepseek-official:
        displayName: GLM Coding
        api: openai-completions
        apiKeyEnv: DJIAN_LLM_KEY
        baseURL: https://open.bigmodel.cn/api/coding/paas/v4
        defaultMaxTokens: 8192
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          thinkingFormat: zai
        models:
          - id: glm-5.3-flash
            name: GLM-5.3 Flash（多模态·快）
            contextWindow: 128000
            maxTokens: 8192
            input: [text, image]
            reasoningEfforts: false
          - id: glm-5.3
            name: GLM-5.3（纯文本·更强）
            contextWindow: 128000
            maxTokens: 8192
            input: [text]
            reasoningEfforts: false

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: glm-5.3-flash

# 插件身份清点只服务 DeepSeek 官方上游；在 GLM 上游上无用且会让请求扩展整轮失败
- id: plugin-package-inventory-deepseek
  config:
    enabled: false

# ---- 预设：D剪 自有预设承载剪辑人格（standard 预设的人格段会覆盖全局 system-prompt 人格） ----
- id: ui-agent-preset
  name: '@deepseek-ai/dsh-client-ui-agent-preset'
  disabled: true

- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: djian

# ---- 剪辑面板 / 资源库面板（官方 web 壳右侧栏 tab） ----
- insert:
    - id: djian-timeline-ui
      name: '@djian/client-ui-timeline'
    - id: djian-library-ui
      name: '@djian/client-ui-library'

# ---- 宿主桥接：会话感知的 djian_* 剪辑工具 + 用户编辑事件注入 + AI 状态同步 ----
# 引擎由 DSHL 按 manifest.services 托管；其他启动器下由本插件按需拉起
- insert:
    - id: djian-host-bridge
      name: '@djian/host-bridge'
      config:
        injectActivity: true

# 默认暗色（DSH 0.2 的主题偏好属于插件 Config，不再走 manifest.settings）
- id: ui-theme
  name: '@deepseek-ai/dsh-client-ui-theme'
  config:
    preference: dark
    fontSize: 14

# ---- D剪 预设：沿用 standard 的工具集，替换人格；技能目录指向 profile 内的 .dsh/skills ----
- insert:
    - id: preset-djian
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: djian
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: 工作目录是 {{cwd}}。素材与时间线以 djian_* 工具返回为准。
              prefix: |-
                你是 D剪 的 AI 视频剪辑助手，由 {{model}} 驱动，和用户一起剪同一个项目：用户在右侧剪辑面板手动操作，你通过 djian_* 工具操作，两边实时同步同一份时间线。
                一个会话固定对应一个剪辑项目，工具永远作用于它；不存在“切换项目”，不要向用户提这个概念。
                【协同纪律】
                1. 用户在面板里的修改会在你每一步开始时以 <editor-activity> 消息告诉你（修改摘要 + 用户当前选中的对象与播放头）。这些修改已经生效，以它为准；除非用户明确要求，不要撤销或覆盖用户刚做的修改。用户说“这段/这里/这个”时，优先理解为其中的当前选中与播放头。
                2. 新会话、或出现你不了解的变化时，先 djian_timeline 看大纲（带 id）再动手；id 与素材名一律以工具返回为准，历史消息里的旧 id 可能已失效。
                3. 修改一律用 djian_apply_ops：一次需求拆成一批 ops 提交，并写 label（一句话说明，会出现在用户的历史记录里）。回执里 rejected/ignored 写明了原因，据此修正后只补缺失的操作，绝不原样重发整批；conflicts 表示对象刚被用户改过，以用户为准。
                4. 被用户锁定的轨道不要修改，也不要擅自解锁——锁定就是用户在说“别动这里”。
                5. 改完重要内容用 djian_frame 抽查（可一次传多个时间点得到联络图）。工具报错时错误文本就是真实原因；同一操作连续失败两次就停下来向用户说明。
                【素材】素材按项目隔离：djian_assets 看清单；本地生成的文件用 djian_import_asset(path) 入库；缺素材时用 djian_search_media + djian_download_media（英文关键词更准，注意许可）。生成素材前先看画布尺寸与帧率。不要自己往素材目录复制文件，不要直接改时间线文件或调用 ffmpeg。
                【剪辑审美】
                1. 节奏：短视频片段默认 1.5–3 秒；超过 5 秒的单镜头主动建议切短；快切三段后插一个较长镜头喘息。
                2. 钩子：开头 3 秒放最强画面；“精彩合集”把最精彩的放前面。
                3. 转场克制：相邻片段默认硬切；需要时用 dissolve（0.3–0.6 秒）或 fadeBlack 表示时间跳跃；一条片子转场类型不超过两种。
                4. 动效克制：预设动画风格不超过两种；静态图片配 kenBurns 或 kenBurnsOut；优先 animationPreset，只有用户要精确轨迹才手排关键帧。
                5. 音画：有人声时配乐压到 0.2–0.3，或把人声轨 role 设为 voice、配乐轨开启 duck 自动闪避；音乐结尾用 fadeOut 1.5–2 秒，别硬断；从音乐高潮段取素材（inPoint 别总是 0）。
                6. 字幕：一句不超过 15 字、停留不少于 1.5 秒；默认底部，字号约为画面高度的 5–7%（720p 用 40–50）；画面复杂时加描边或底框保证可读；整片字体统一（sans 思源黑体 / serif 思源宋体 / kuaile / qingke / mashan）。
                回复保持简短中文：说清做了什么、还有什么建议。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs: ['./.dsh/skills']
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

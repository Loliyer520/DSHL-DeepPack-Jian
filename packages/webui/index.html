<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D剪 · AI 视频剪辑工作台</title>
    <script>
      // 主题必须在 React 挂载前落到 <html> 上，否则暗色用户首帧会闪白。
      // 默认暗色（剪辑工作台惯例），用户手动切换后记进 localStorage。
      try {
        var t = localStorage.getItem("djian-theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
